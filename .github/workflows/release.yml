name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libvulkan-dev \
            libwayland-dev

      - name: Build
        run: cargo build --release --locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          rm -rf dist
          mkdir -p dist/zerotier-gui
          cp target/release/zerotier-gui dist/zerotier-gui/
          cp packaging/linux/zerotier-gui.desktop dist/zerotier-gui/
          cp img/zerotier-gui.png dist/zerotier-gui/
          cp LICENSE NOTICE README.md dist/zerotier-gui/
          tar -C dist -czf zerotier-gui-${{ matrix.name }}.tar.gz zerotier-gui

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          rm -rf dist
          mkdir -p dist
          APP=dist/ZeroTier-GUI.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/zerotier-gui "$APP/Contents/MacOS/"
          cp packaging/macos/Info.plist "$APP/Contents/"
          cp img/zerotier-gui.png "$APP/Contents/Resources/"
          cp LICENSE NOTICE README.md dist/
          ditto -c -k --sequesterRsrc --keepParent "$APP" zerotier-gui-${{ matrix.name }}.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/zerotier-gui.exe dist/
          Copy-Item -Path LICENSE, NOTICE, README.md, img/zerotier-gui.png -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath zerotier-gui-${{ matrix.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-gui-${{ matrix.name }}
          path: |
            zerotier-gui-*.tar.gz
            zerotier-gui-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
